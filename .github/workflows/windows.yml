name: Windows capture and composition smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check .
      - name: Install FFmpeg for native Windows capture tests
        run: choco install ffmpeg --yes --no-progress
      - name: Enumerate actual DirectShow inputs (empty is OK; no recording)
        run: |
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -c "from octet_ableton.live_audio import discover_devices; print(discover_devices(lambda: None))"
      - name: Device selection, bounded capture, synthetic PCM to MP3 and restoration
        env:
          PYTHONPATH: tests
        run: uv run python -m unittest -v test_live_audio test_live_listen
      - name: Launcher, setup, private token, MIDI and protocol fixtures (no Live)
        env:
          PYTHONPATH: tests
        run: uv run python -m unittest test_extension.SetupTests.test_install_update_backup_and_private_token test_extension.ProcessSmoke test_bridge_client test_capture_control test_advanced_compose
