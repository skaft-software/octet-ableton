name = "octet-ableton"
version = "0.1.0"
api_version = "0.4"
description = "Unofficial Ableton Live integration: audio slices and batch composition"

[entrypoint]
command = "run-extension"

[capabilities]
filesystem = "unrestricted"
process = true
network = true

[contributes]
tools = ["ableton_listen", "ableton_compose", "ableton_live_object_model"]
commands = ["ableton"]
menu = true
confirmations = true
